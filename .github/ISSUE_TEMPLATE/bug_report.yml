name: Bug report
description: Report a problem with the project or its notebooks.
title: "[Bug]: "
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps or commands that led to the problem.
      placeholder: |
        1. Open ...
        2. Run ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message or screenshot
      description: Paste the relevant error text, if available.
    validations:
      required: false
